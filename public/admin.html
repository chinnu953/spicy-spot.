<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spicy Spot | Admin Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{background:#f7f1ea}.admin-shell{min-height:100vh}
    .admin-top{background:#171717;color:#fff;padding:18px 0}
    .admin-top-inner{display:flex;justify-content:space-between;align-items:center}
    .admin-brand{font-weight:800;font-size:21px}.admin-brand span{color:#ff7a1a}
    .login-wrap{min-height:75vh;display:grid;place-items:center;padding:40px 0}
    .login-card{background:#fff;padding:34px;border-radius:22px;box-shadow:var(--shadow);width:min(430px,92%)}
    .login-card h1{font-size:36px;letter-spacing:-1px;margin:0 0 10px}
    .login-card p{color:#777;line-height:1.6}
    .login-card label{margin-top:22px}
    .dashboard{padding:35px 0 70px}
    .dash-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
    .dash-head h1{font-size:42px;letter-spacing:-1px;margin:0}.dash-head p{color:#777;margin:7px 0 0}
    .live{background:#e8f6ed;color:#176b3b;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{font-size:28px}.stat span{display:block;color:#777;font-size:12px;margin-top:4px}
    .orders{display:grid;gap:14px}.order-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:20px}
    .order-id{font-size:12px;color:#777;font-weight:800}.order-card h3{margin:6px 0;font-size:19px}.meta{color:#555;font-size:13px;line-height:1.7}.total-admin{font-size:20px;font-weight:800;color:#e9471c}
    .order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.status-select{padding:9px;border-radius:10px;border:1px solid #ddd}
    .delete{border:0;background:#fee;color:#a00;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:700}
    .empty{background:#fff;border:1px dashed #d9cabc;border-radius:18px;padding:45px;text-align:center;color:#777}
    .toast{position:fixed;right:20px;bottom:20px;background:#171717;color:#fff;padding:16px 18px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:50;max-width:360px}
    .toast.show{display:block;animation:pop .2s ease}
    @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    @media(max-width:650px){.stats{grid-template-columns:1fr}.order-card{grid-template-columns:1fr}.order-actions{justify-content:flex-start}.dash-head{display:block}.live{display:inline-block;margin-top:12px}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-top">
      <div class="container admin-top-inner">
        <div class="admin-brand">🌶️ Spicy <span>Spot</span> — Admin</div>
        <a href="/" style="color:#fff;font-size:13px">← Customer site</a>
      </div>
    </div>

    <section id="loginView" class="login-wrap">
      <form id="loginForm" class="login-card">
        <p class="eyebrow">ADMIN ONLY</p>
        <h1>Order dashboard</h1>
        <p>New customer orders will appear here instantly with a notification.</p>
        <label>Admin password<input id="password" type="password" required placeholder="Enter admin password"></label>
        <button class="btn btn-primary btn-large">Open dashboard</button>
        <p id="loginStatus" class="form-status error"></p>
      </form>
    </section>

    <section id="dashView" class="dashboard container" hidden>
      <div class="dash-head">
        <div><h1>Today's orders</h1><p>Keep this page open to receive live new-order notifications.</p></div>
        <span class="live">● LIVE NOTIFICATIONS</span>
      </div>
      <div class="stats">
        <div class="stat"><b id="newCount">0</b><span>New orders</span></div>
        <div class="stat"><b id="orderCount">0</b><span>Total orders</span></div>
        <div class="stat"><b id="salesTotal">₹0</b><span>Total order value</span></div>
      </div>
      <div id="orders" class="orders"></div>
    </section>
  </div>
  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const loginView = document.getElementById("loginView");
    const dashView = document.getElementById("dashView");
    const loginForm = document.getElementById("loginForm");
    const loginStatus = document.getElementById("loginStatus");
    const ordersEl = document.getElementById("orders");
    const toast = document.getElementById("toast");
    let token = localStorage.getItem("spicySpotAdminToken");
    let orders = [];

    function money(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }
    function showToast(order){
      toast.innerHTML = `🔔 <b>New order!</b><br>${escapeHtml(order.name)} ordered ${escapeHtml(order.item)} × ${order.quantity} — ${money(order.total)}`;
      toast.classList.add("show");
      setTimeout(()=>toast.classList.remove("show"),7000);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.frequency.value=880; gain.gain.value=.05; osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+.18);
      } catch {}
    }

    function render(){
      document.getElementById("orderCount").textContent = orders.length;
      document.getElementById("newCount").textContent = orders.filter(o=>o.status==="New").length;
      document.getElementById("salesTotal").textContent = money(orders.reduce((s,o)=>s+Number(o.total||0),0));
      if(!orders.length){ ordersEl.innerHTML = '<div class="empty">No orders yet. New customer orders will show here.</div>'; return; }
      ordersEl.innerHTML = orders.map(o => `
        <article class="order-card">
          <div>
            <div class="order-id">${escapeHtml(o.id)} • ${new Date(o.createdAt).toLocaleString()}</div>
            <h3>${escapeHtml(o.name)} <span class="total-admin">${money(o.total)}</span></h3>
            <div class="meta">
              📞 <b>${escapeHtml(o.phone)}</b><br>
              📍 Room: <b>${escapeHtml(o.room)}</b><br>
              🍛 ${o.items ? o.items.map(i=>`${escapeHtml(i.name)} × <b>${i.quantity}</b>`).join("<br>🍛 ") : `${escapeHtml(o.item)} × <b>${o.quantity}</b>`}
            </div>
          </div>
          <div class="order-actions">
            <select class="status-select" data-id="${o.id}">
              ${["New","Preparing","Delivered"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
            </select>
            <button class="delete" data-delete="${o.id}">Delete</button>
          </div>
        </article>`).join("");
    }

    async function api(url, options={}){
      options.headers = {...options.headers, Authorization:"Bearer "+token, "Content-Type":"application/json"};
      const r=await fetch(url,options); if(r.status===401){logout();throw new Error("Session expired");}
      const data=await r.json(); if(!r.ok) throw new Error(data.error||"Request failed"); return data;
    }
    async function load(){
      try { orders=await api("/api/orders"); render(); }
      catch(e){ loginStatus.textContent=e.message; }
    }
    function logout(){localStorage.removeItem("spicySpotAdminToken");token=null;dashView.hidden=true;loginView.style.display="grid";}
    function openDash(){loginView.style.display="none";dashView.hidden=false;load();}

    loginForm.addEventListener("submit",async e=>{
      e.preventDefault(); loginStatus.textContent="";
      try{
        const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});
        const d=await r.json(); if(!r.ok) throw new Error(d.error||"Login failed");
        token=d.token; localStorage.setItem("spicySpotAdminToken",token); openDash();
      }catch(err){loginStatus.textContent=err.message;}
    });

    ordersEl.addEventListener("change",async e=>{
      if(!e.target.matches(".status-select"))return;
      const id=e.target.dataset.id;
      try{const d=await api("/api/orders/"+id,{method:"PATCH",body:JSON.stringify({status:e.target.value})});orders=orders.map(o=>o.id===id?d.order:o);render();}
      catch(err){alert(err.message);}
    });
    ordersEl.addEventListener("click",async e=>{
      const id=e.target.dataset.delete; if(!id)return;
      if(!confirm("Delete this order?"))return;
      try{await api("/api/orders/"+id,{method:"DELETE"});orders=orders.filter(o=>o.id!==id);render();}
      catch(err){alert(err.message);}
    });

    const socket=io();
    socket.on("new-order",order=>{
      if(!token)return;
      orders.unshift(order);render();showToast(order);
    });
    socket.on("order-updated",order=>{orders=orders.map(o=>o.id===order.id?order:o);render();});
    socket.on("order-deleted",id=>{orders=orders.filter(o=>o.id!==id);render();});

    if(token) openDash();
  </script>
</body>
</html>
